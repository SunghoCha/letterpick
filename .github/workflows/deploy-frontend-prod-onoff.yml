name: Deploy Frontend Prod On/Off

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-frontend-prod-onoff:
    name: Deploy Frontend Prod On/Off
    runs-on: ubuntu-latest
    environment: prod

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          required_env=(
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
          )

          for name in "${required_env[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-prod-onoff-frontend-deploy

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Resolve prod on/off frontend outputs
        run: |
          terraform -chdir=terraform/prod-persistence init -input=false
          terraform -chdir=terraform/prod-runtime init -input=false

          PERSISTENCE_OUTPUTS=$(terraform -chdir=terraform/prod-persistence output -json)
          RUNTIME_OUTPUTS=$(terraform -chdir=terraform/prod-runtime output -json)

          FRONTEND_BUCKET=$(jq -r '.frontend_bucket_name.value // empty' <<< "$PERSISTENCE_OUTPUTS")
          CLOUDFRONT_DISTRIBUTION_ID=$(jq -r '.frontend_cloudfront_distribution_id.value // empty' <<< "$RUNTIME_OUTPUTS")
          FRONTEND_URL=$(jq -r '.frontend_url.value // empty' <<< "$RUNTIME_OUTPUTS")

          required_outputs=(
            FRONTEND_BUCKET
            CLOUDFRONT_DISTRIBUTION_ID
            FRONTEND_URL
          )

          for name in "${required_outputs[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required. Start prod-persistence and prod-runtime before frontend deploy." >&2
              exit 1
            fi
          done

          {
            echo "FRONTEND_BUCKET=$FRONTEND_BUCKET"
            echo "CLOUDFRONT_DISTRIBUTION_ID=$CLOUDFRONT_DISTRIBUTION_ID"
            echo "VITE_API_BASE_URL="
            echo "FRONTEND_URL=$FRONTEND_URL"
          } >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend assets
        run: |
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" \
            --delete \
            --cache-control "public,max-age=300"

          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"

      - name: Summarize frontend endpoint
        run: |
          echo "### Prod on/off frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend URL: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "API URL: $FRONTEND_URL/api" >> "$GITHUB_STEP_SUMMARY"
