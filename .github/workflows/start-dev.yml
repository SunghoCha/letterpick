name: Start Dev

on:
  workflow_dispatch:
    inputs:
      image_uri:
        description: Full ECR image URI to use for the initial dev task definitions
        required: true
        type: string
      trending_service_image_uri:
        description: Full ECR image URI to use for the initial trending-service task definition
        required: true
        type: string
      enable_perf_observability:
        description: Create the dev CloudWatch performance dashboard
        required: true
        default: true
        type: boolean
      enable_k6_runner:
        description: Create the dev k6 runner EC2 instance
        required: true
        default: true
        type: boolean
      k6_runner_instance_type:
        description: EC2 instance type for the dev k6 runner
        required: true
        default: t3.small
        type: string
      public_feed_search_strategy:
        description: Public feed search strategy for the dev backend
        required: true
        default: fulltext
        type: choice
        options:
          - fulltext
          - like
permissions:
  contents: read
  id-token: write

jobs:
  start-dev:
    name: Start Dev
    runs-on: ubuntu-latest
    environment: dev

    env:
      IMAGE_URI: ${{ inputs.image_uri }}
      TRENDING_SERVICE_IMAGE_URI: ${{ inputs.trending_service_image_uri }}
      ENABLE_PERF_OBSERVABILITY: ${{ inputs.enable_perf_observability }}
      ENABLE_K6_RUNNER: ${{ inputs.enable_k6_runner }}
      K6_RUNNER_INSTANCE_TYPE: ${{ inputs.k6_runner_instance_type }}
      PUBLIC_FEED_SEARCH_STRATEGY: ${{ inputs.public_feed_search_strategy }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      NAVER_CLIENT_ID: ${{ vars.NAVER_CLIENT_ID }}
      BACKEND_SECRET_NAMES: '{"GOOGLE_CLIENT_SECRET":"letterpick/dev/google-client-secret","NAVER_CLIENT_SECRET":"letterpick/dev/naver-client-secret"}'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          required_env=(
            IMAGE_URI
            TRENDING_SERVICE_IMAGE_URI
            ENABLE_PERF_OBSERVABILITY
            ENABLE_K6_RUNNER
            K6_RUNNER_INSTANCE_TYPE
            PUBLIC_FEED_SEARCH_STRATEGY
            AWS_REGION
            AWS_TERRAFORM_ROLE_ARN
            GOOGLE_CLIENT_ID
            NAVER_CLIENT_ID
            BACKEND_SECRET_NAMES
          )

          for name in "${required_env[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-start-dev

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform/dev init -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform/dev validate

      - name: Terraform apply
        run: |
          terraform -chdir=terraform/dev apply -auto-approve -input=false \
            -var="initial_backend_image_uri=$IMAGE_URI" \
            -var="initial_trending_service_image_uri=$TRENDING_SERVICE_IMAGE_URI" \
            -var="enable_perf_observability=$ENABLE_PERF_OBSERVABILITY" \
            -var="enable_k6_runner=$ENABLE_K6_RUNNER" \
            -var="k6_runner_instance_type=$K6_RUNNER_INSTANCE_TYPE" \
            -var="public_feed_search_strategy=$PUBLIC_FEED_SEARCH_STRATEGY" \
            -var="google_client_id=$GOOGLE_CLIENT_ID" \
            -var="naver_client_id=$NAVER_CLIENT_ID" \
            -var="backend_secret_names=$BACKEND_SECRET_NAMES"

      - name: Summarize dev endpoint
        run: |
          API_URL=$(terraform -chdir=terraform/dev output -raw api_url)
          FRONTEND_URL=$(terraform -chdir=terraform/dev output -raw frontend_url)
          TRENDING_SERVICE_NAME=$(terraform -chdir=terraform/dev output -raw trending_service_name)
          TRENDING_SERVICE_LOG_GROUP_NAME=$(terraform -chdir=terraform/dev output -raw trending_service_log_group_name)
          PERFORMANCE_DASHBOARD_NAME=$(terraform -chdir=terraform/dev output performance_dashboard_name)
          K6_RUNNER_INSTANCE_ID=$(terraform -chdir=terraform/dev output k6_runner_instance_id)
          echo "### Dev runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend URL: $FRONTEND_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "API URL: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Trending service: $TRENDING_SERVICE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Trending service log group: $TRENDING_SERVICE_LOG_GROUP_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Public feed search strategy: $PUBLIC_FEED_SEARCH_STRATEGY" >> "$GITHUB_STEP_SUMMARY"
          echo "Performance dashboard: $PERFORMANCE_DASHBOARD_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "k6 runner instance id: $K6_RUNNER_INSTANCE_ID" >> "$GITHUB_STEP_SUMMARY"
