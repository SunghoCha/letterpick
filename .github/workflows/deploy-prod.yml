name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_uri:
        description: Full ECR image URI to deploy to prod
        required: true
        type: string
      target:
        description: Prod target to deploy
        required: true
        default: api
        type: choice
        options:
          - api
          - worker

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api-prod:
    name: Deploy API Prod
    if: ${{ inputs.target == 'api' }}
    runs-on: ubuntu-latest
    environment: prod

    env:
      IMAGE_URI: ${{ inputs.image_uri }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      API_TASK_FAMILY: ${{ vars.API_TASK_FAMILY }}
      API_CONTAINER_NAME: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate API deploy inputs
        run: |
          required_env=(
            IMAGE_URI
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
            ECS_CLUSTER
            ECS_API_SERVICE
            API_TASK_FAMILY
            API_CONTAINER_NAME
          )

          for name in "${required_env[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-prod-api-deploy

      - name: Download current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$API_TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json > api-current-task-definition.json

      - name: Render API task definition
        id: api-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-current-task-definition.json
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy API with ECS native deployment strategy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Summarize API deployment
        run: |
          echo "### Prod API deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Strategy: ECS native service deployment" >> "$GITHUB_STEP_SUMMARY"

  deploy-worker-prod:
    name: Deploy Worker Prod
    if: ${{ inputs.target == 'worker' }}
    runs-on: ubuntu-latest
    environment: prod

    env:
      IMAGE_URI: ${{ inputs.image_uri }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      WORKER_TASK_FAMILY: ${{ vars.WORKER_TASK_FAMILY }}
      WORKER_CONTAINER_NAME: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Worker deploy inputs
        run: |
          required_env=(
            IMAGE_URI
            AWS_REGION
            AWS_DEPLOY_ROLE_ARN
            ECS_CLUSTER
            ECS_WORKER_SERVICE
            WORKER_TASK_FAMILY
            WORKER_CONTAINER_NAME
          )

          for name in "${required_env[@]}"; do
            if [ -z "${!name}" ]; then
              echo "$name is required" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-prod-worker-deploy

      - name: Download current Worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$WORKER_TASK_FAMILY" \
            --query 'taskDefinition' \
            --output json > worker-current-task-definition.json

      - name: Render Worker task definition
        id: worker-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-current-task-definition.json
          container-name: ${{ env.WORKER_CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Deploy Worker with ECS rolling update
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Summarize Worker deployment
        run: |
          echo "### Prod Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Strategy: ECS rolling update" >> "$GITHUB_STEP_SUMMARY"
