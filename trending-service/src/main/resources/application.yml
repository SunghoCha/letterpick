spring:
  application:
    name: trending-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    aws:
      region:
        static: ${LETTERPICK_AWS_REGION:ap-northeast-2}
      sqs:
        enabled: ${LETTERPICK_TRENDING_SQS_ENABLED:false}
        queue-not-found-strategy: FAIL
  datasource:
    hikari:
      pool-name: trending-service
  flyway:
    table: trending_flyway_schema_history
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [trace:%X{trace_id:-}] [span:%X{span_id:-}] [req:%X{requestId:-}]"

management:
  health:
    redis:
      enabled: ${LETTERPICK_TRENDING_REDIS_HEALTH_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      application: ${MANAGEMENT_METRICS_TAGS_APPLICATION:${spring.application.name:trending-service}}
      environment: ${LETTERPICK_ENV:local}
      service: ${MANAGEMENT_METRICS_TAGS_SERVICE:trending-service}

letterpick:
  trending:
    lifecycle-events-queue: ${LETTERPICK_TRENDING_LIFECYCLE_EVENTS_QUEUE}
    score-events-queue: ${LETTERPICK_TRENDING_SCORE_EVENTS_QUEUE}
    sqs-listener:
      enabled: ${LETTERPICK_TRENDING_SQS_LISTENER_ENABLED:false}
      score:
        max-concurrent-messages: ${LETTERPICK_TRENDING_SCORE_LISTENER_MAX_CONCURRENT_MESSAGES:10}
    ranking:
      summary:
        reader: ${LETTERPICK_TRENDING_RANKING_SUMMARY_READER:redis}
        writer: ${LETTERPICK_TRENDING_RANKING_SUMMARY_WRITER:redis}
        default-limit: ${LETTERPICK_TRENDING_RANKING_SUMMARY_DEFAULT_LIMIT:20}
        max-size: ${LETTERPICK_TRENDING_RANKING_SUMMARY_MAX_SIZE:100}
        redis-key-prefix: ${LETTERPICK_TRENDING_RANKING_SUMMARY_REDIS_KEY_PREFIX:letterpick:trending:ranking}
      state:
        redis-key-prefix: ${LETTERPICK_TRENDING_RANKING_STATE_REDIS_KEY_PREFIX:letterpick:trending:issue}
