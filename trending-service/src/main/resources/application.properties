spring.application.name=trending-service
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.cloud.aws.region.static=${LETTERPICK_AWS_REGION:ap-northeast-2}
spring.cloud.aws.sqs.enabled=${LETTERPICK_TRENDING_SQS_ENABLED:false}
spring.cloud.aws.sqs.queue-not-found-strategy=FAIL
spring.datasource.hikari.pool-name=trending-service
spring.flyway.table=trending_flyway_schema_history
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.shutdown=graceful

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

letterpick.trending.lifecycle-events-queue=${LETTERPICK_TRENDING_LIFECYCLE_EVENTS_QUEUE}
letterpick.trending.score-events-queue=${LETTERPICK_TRENDING_SCORE_EVENTS_QUEUE}
letterpick.trending.sqs-listener.enabled=${LETTERPICK_TRENDING_SQS_LISTENER_ENABLED:false}
