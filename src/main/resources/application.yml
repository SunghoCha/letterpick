spring:
  application:
    name: letterPick
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    aws:
      region:
        static: ${LETTERPICK_AWS_REGION:ap-northeast-2}
      cloudwatch:
        enabled: ${LETTERPICK_CLOUDWATCH_METRICS_ENABLED:false}
        region: ${LETTERPICK_AWS_REGION:ap-northeast-2}
      sqs:
        enabled: ${LETTERPICK_SQS_ENABLED:false}
        queue-not-found-strategy: FAIL
        region: ${LETTERPICK_AWS_REGION:ap-northeast-2}
  flyway:
    enabled: false
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
  datasource:
    hikari:
      pool-name: letterpick-api
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope: openid,profile,email
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope: name,email,profile_image
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [req:%X{requestId:-}]"

management:
  cloudwatch:
    metrics:
      export:
        namespace: ${LETTERPICK_CLOUDWATCH_METRICS_NAMESPACE:LetterPick/Local/Application}
        step: ${LETTERPICK_CLOUDWATCH_METRICS_STEP:1m}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    tags:
      application: ${spring.application.name:letterPick}
      environment: ${LETTERPICK_ENV:local}
      service: api

# OAuth 가입/로그인 후 redirect 대상 + CORS allowed origin.
# 배포 환경은 FRONTEND_BASE_URL 환경변수로 주입한다.
frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

newsletter:
  inbox-address:
    domain: ${NEWSLETTER_INBOX_ADDRESS_DOMAIN:inbound.letterpick.local}
  public-feed:
    collector-inbox-address: ${NEWSLETTER_PUBLIC_FEED_COLLECTOR_INBOX_ADDRESS}

letterpick:
  search:
    public-feed:
      strategy: ${LETTERPICK_PUBLIC_FEED_SEARCH_STRATEGY:fulltext}
  aws:
    region: ${LETTERPICK_AWS_REGION:ap-northeast-2}
  mail:
    receive-queue: ${LETTERPICK_MAIL_RECEIVE_QUEUE:letterpick-mail-receive}
    receive-dlq: ${LETTERPICK_MAIL_RECEIVE_DLQ:${LETTERPICK_MAIL_RECEIVE_QUEUE:letterpick-mail-receive}-dlq}
    sqs-listener:
      enabled: ${LETTERPICK_MAIL_SQS_LISTENER_ENABLED:false}
  outbox:
    publish:
      enabled: ${LETTERPICK_OUTBOX_PUBLISH_ENABLED:false}
    retry:
      enabled: ${LETTERPICK_OUTBOX_RETRY_ENABLED:false}
