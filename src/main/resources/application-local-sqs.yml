spring:
  cloud:
    aws:
      credentials:
        access-key: ${LETTERPICK_LOCAL_AWS_ACCESS_KEY:test}
        secret-key: ${LETTERPICK_LOCAL_AWS_SECRET_KEY:test}
      sqs:
        enabled: true
        endpoint: ${LETTERPICK_LOCAL_SQS_ENDPOINT:http://localhost:4566}

letterpick:
  public-issue:
    view-count:
      anonymous-cookie-secure: false
  mail:
    sqs-listener:
      enabled: true
  outbox:
    queue:
      trending-lifecycle-events: letterpick-local-trending-lifecycle-events
      trending-score-events: letterpick-local-trending-score-events
    publish:
      enabled: true
