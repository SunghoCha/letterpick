spring:
  cloud:
    aws:
      sqs:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

frontend:
  base-url: http://localhost:3000

newsletter:
  inbox-address:
    domain: inbound.letterpick.test
  public-feed:
    collector-inbox-address: omcxewctypxo@inbound-dev.letterpicknews.com

letterpick:
  public-issue:
    ranking:
      default-limit: 20
      max-limit: 100
    view-count:
      anonymous-cookie-secure: false
  outbox:
    queue:
      trending-lifecycle-events: letterpick-test-trending-lifecycle-events
      trending-score-events: letterpick-test-trending-score-events
